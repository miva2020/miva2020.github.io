<!-- ============================================================
     _includes/header.html — 顶部导航栏（sticky 固定 + 毛玻璃）
     左侧：站点标题；右侧：☀️/🌊 主题切换按钮。
     主题切换逻辑见 assets/js/theme-switcher.js。
     ============================================================ -->
<header class="site-nav">
  <div class="container">
    <a class="site-title" href="{{ '/' | relative_url }}">{{ site.title }}</a>
    <button class="theme-toggle" type="button" aria-label="切换主题">☀️</button>
  </div>
</header>
