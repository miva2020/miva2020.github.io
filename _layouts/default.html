<!doctype html>
<!-- ============================================================
     _layouts/default.html — 全站默认布局
     作用：定义 <head>（含 Google Fonts、style.css、防 FOUC 内联主题脚本）
           与 <body> 框架（header / main content / footer / JS）。
     子页面通过 layout: default 继承，正文注入到 {{ content }}。
     ============================================================ -->
<html lang="zh-CN" data-theme="{{ site.default_theme | default: 'warm' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>
      {% if page.title %}{{ page.title }} - {% endif %}{{ site.title }}
    </title>
    <meta name="description" content="{{ page.description | default: site.description }}">
    <link rel="canonical" href="{{ page.url | absolute_url }}">

    <!-- Google Fonts：Ma Shan Zheng（手写标题）+ Noto Sans TC（思源黑体，替代正文文楷）-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">

    <!-- 站点样式：Jekyll 编译 _sass 输出后的 style.css -->
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">

    <!-- 防 FOUC：首屏内联最小脚本，提前应用 localStorage 主题，避免首屏闪烁 -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("blog-theme");
          if (t === "warm" || t === "ocean") {
            document.documentElement.setAttribute("data-theme", t);
          }
        } catch (e) { /* 隐私模式禁用 localStorage 时静默忽略 */ }
      })();
    </script>

    {% seo %}
  </head>
  <body>
    {% include header.html %}

    <main>
      {{ content }}
    </main>

    {% include footer.html %}

    <script src="{{ '/assets/js/theme-switcher.js' | relative_url }}" defer></script>
    <script src="{{ '/assets/js/daily-quote.js' | relative_url }}" defer></script>
  </body>
</html>
