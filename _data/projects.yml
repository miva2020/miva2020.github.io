# ============================================================================
# _data/projects.yml — 项目作品数据
# 作用：被 _includes/projects-preview.html 读取，渲染项目卡片列表。
# 字段说明：
#   name        项目名称（必填）
#   description 一句话描述（必填）
#   tags        技术栈标签数组，会渲染成彩色小标签（必填）
#   repo        GitHub 仓库链接（必填，可填 # 占位）
# 添加新项目只需在此文件末尾追加一项即可，无需改动模板。
# ============================================================================

